name: github pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - uses: actions/setup-go@v5
        with:
          go-version: '^1.25'

          # Caching seems to really slow down the build due to the time
          # taken to save the cache.
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          # extended: true

      - name: Prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/exchange_index.py
          python scripts/exchange_verify.py
          python scripts/blog_index.py
          python scripts/knowledge_base.py

      - name: VQL highlighting
        run: make vql_highlight

      - name: BuildIndex
        run: make index

      - name: Build
        run: hugo

      - name: Check VQL highlighting
        run: |
          if grep -rq 'data-vql="fallback"' public; then
            echo "ERROR: some VQL code fences fell back to SQL highlighting."
            echo "Regenerate the highlight cache with: make vql_highlight"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: BuildSearchIndex
        run: bun run pagefind

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
