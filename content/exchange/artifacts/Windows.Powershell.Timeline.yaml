name: Windows.Powershell.Timeline
author: Mohammed Hasan, 0xHasanM
description: |
   This artifact extracts commands executed from each user's ConsoleHost_History.txt and correlates the timestamps of Data_Added events in the USNJRNL with those commands to construct a timeline of PowerShell command execution.

   For each user, the most recent DATA_EXTEND event is paired with the
   last line of the history file, the next most recent with the line
   before it, and so on. Commands without a matching USN event have
   an empty Timestamp, and USN events without a matching command show
   "N/A" as the Command.

# Can be CLIENT, CLIENT_EVENT, SERVER, SERVER_EVENT or NOTEBOOK
type: CLIENT

parameters:
   - name: user
     description: Regex to match the profile folder name of the users to include.
     default: .
     type: regex

references:
  - https://www.linkedin.com/posts/0xhasanm_sundfirday-dfir-powershell-activity-7395908066409484288-eNSo

sources:
  - precondition:
      SELECT OS From info() where OS = 'windows'

    query: |
      -- The profile folder is the 8th path component from the end:
      -- C:\Users\<user>\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt
      LET USN_EVENTS <= SELECT Timestamp,
                               OSPath[-8] AS Username
        FROM Artifact.Windows.Forensics.Usn(FileNameRegex="ConsoleHost_History.txt")
        WHERE Username =~ user
          AND len(list=Reason) = 2
          AND "DATA_EXTEND" in Reason

      LET PSReadline <= SELECT LineNum,
                               Line,
                               OSPath[-8] AS Username
        FROM Artifact.Windows.System.Powershell.PSReadline()
        WHERE Username =~ user

      LET Users <= SELECT Username AS TargetUser
        FROM chain(a={ SELECT Username FROM USN_EVENTS },
                   b={ SELECT Username FROM PSReadline })
        GROUP BY TargetUser

      -- Number each user's events and commands from newest to oldest
      -- so the Nth newest event pairs with the Nth newest command.
      -- These are functions so count() restarts at 1 for each user.
      LET UserEvents(TargetUser) = SELECT
          format(format="%v|%v", args=[TargetUser, count()]) AS Key,
          TargetUser AS Username,
          Timestamp
        FROM foreach(row={
          SELECT Timestamp FROM USN_EVENTS
          WHERE Username = TargetUser
          ORDER BY Timestamp DESC
        })

      LET UserCommands(TargetUser) = SELECT
          format(format="%v|%v", args=[TargetUser, count()]) AS Key,
          TargetUser AS Username,
          Line
        FROM foreach(row={
          SELECT LineNum, Line FROM PSReadline
          WHERE Username = TargetUser
          ORDER BY LineNum DESC
        })

      LET USN_EVENTS_Indexed <= SELECT * FROM foreach(row=Users, query={
          SELECT * FROM UserEvents(TargetUser=TargetUser)
        })

      LET PSReadline_Indexed <= SELECT * FROM foreach(row=Users, query={
          SELECT * FROM UserCommands(TargetUser=TargetUser)
        })

      -- Index both sides on Key so the join is a lookup rather than
      -- a nested scan (https://docs.velociraptor.app/docs/vql/join/).
      LET CommandLookup <= memoize(key="Key", period=100000, query={
          SELECT Key, Line FROM PSReadline_Indexed
        })

      LET USNLookup <= memoize(key="Key", period=100000, query={
          SELECT Key, Timestamp FROM USN_EVENTS_Indexed
        })

      SELECT * FROM chain(
        a={
          SELECT Timestamp,
                 Username,
                 get(item=CommandLookup, field=Key).Line || "N/A" AS Command
          FROM USN_EVENTS_Indexed
        },
        b={
          SELECT NULL AS Timestamp,
                 Username,
                 Line AS Command
          FROM PSReadline_Indexed
          WHERE NOT get(item=USNLookup, field=Key)
        })
      ORDER BY Timestamp