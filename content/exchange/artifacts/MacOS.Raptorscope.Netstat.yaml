name: MacOS.Raptorscope.Netstat
author: cac0ns3c (https://github.com/cac0ns3c/Raptorscope)
description: |
  Report the live TCP/UDP socket table (listeners + established) and enrich each
  connection with its owning process — the network side of triage (reverse/bind
  shells, C2 beacons, exfil). Wraps the `netstat()` plugin; there is no
  first-party macOS netstat artifact.
  Keywords: network, connections, netstat, listener, reverse shell, C2, macOS.
  MITRE T1049 / T1571 / T1095.

  ### Output
  One row per socket (Pid, Name, Family, Type, Status, LocalIP, LocalPort,
  RemoteIP, RemotePort, Timestamp). `lsof` enrichment for the executable path is a planned follow-up.
type: CLIENT
reference:
  - https://attack.mitre.org/techniques/T1049/
  - https://docs.velociraptor.app/vql_reference/plugin/netstat/
column_types:
  - name: Timestamp
    type: timestamp
sources:
  - name: Netstat
    precondition: SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      -- Live-capture reality (verified against a real Mac): netstat() carries no
      -- process name (only Pid), and Family/Type are integers — so resolve the
      -- executable via Pslist and use the *String forms (IPv4/TCP), and Status is
      -- "ESTAB"/"LISTEN".
      LET procs <= SELECT Pid AS P, Exe AS E FROM Artifact.MacOS.Sys.Pslist()
      LET lut <= memoize(query=procs, key="P")
      SELECT Pid,
             basename(path=get(item=lut, field=format(format="%v", args=Pid)).E) AS Name,
             get(item=lut, field=format(format="%v", args=Pid)).E AS Exe,
             FamilyString AS Family, TypeString AS Type, Status,
             Laddr.IP AS LocalIP, Laddr.Port AS LocalPort,
             Raddr.IP AS RemoteIP, Raddr.Port AS RemotePort,
             timestamp(epoch=now()) AS Timestamp
      FROM netstat()
      WHERE FamilyString =~ "IPv"   -- IPv4/IPv6 only; drop unix domain sockets
