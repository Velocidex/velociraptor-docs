      LET hermes_skills = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "skill_definition" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/skills/**",
          ], accessor="file")
          WHERE DeepCollection

      LET hermes_memory = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "memory" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/memories/**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET hermes_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "log" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/logs/**",
          ], accessor="file")
          WHERE CollectLogs

      LET hermes_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
