name: IONSEC.TRACE.AI.Agents
description: |
  IONSEC TRACE — Collect forensic artifacts from AI agent frameworks
  (Hermes Agent, AutoGPT, CrewAI, LangChain/LangGraph, Microsoft AutoGen,
  Aider, Shell-GPT).

  Version: 0.1.0
  Author: IONSEC

  This artifact collects:
  - Configuration files and settings for agent frameworks
  - Conversation/chat history and session databases
  - Agent memory, plans, and workspace artifacts
  - Authentication tokens and API keys stored in agent configs
  - Process detection for running agent processes

type: CLIENT
parameters:
  - name: CollectChatHistory
    description: Collect conversation/chat history databases (may contain PII)
    type: bool
    default: true
  - name: CollectLogs
    description: Collect agent framework logs
    type: bool
    default: true
  - name: DeepCollection
    description: Include session-level and workspace data (large, skip for quick triage)
    type: bool
    default: false

sources:
  - name: HermesAgent_Linux
    precondition: SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET home = expand(path=HomeDir)

      LET hermes_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/config.yaml",
              home + "/.hermes/config.yml",
              home + "/.hermes/config.json",
              home + "/.hermes/config.toml",
              home + "/.hermes/profiles/**/config.yaml",
              home + "/.hermes/profiles/**/config.yml",
          ], accessor="file")

      LET hermes_skills = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "skill_definition" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/skills/**",
          ], accessor="file")
          WHERE DeepCollection

      LET hermes_memory = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "memory" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/memories/**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET hermes_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "log" AS ArtifactType, "hermes_agent" AS Platform
          FROM glob(globs=[
              home + "/.hermes/logs/**",
          ], accessor="file")
          WHERE CollectLogs

      LET hermes_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
                 "hermes_agent" AS Platform
          FROM pslist() WHERE Name =~ "(?i)hermes"

      SELECT * FROM chain(a=hermes_config, b=hermes_skills, c=hermes_memory, d=hermes_logs, e=hermes_proc)

