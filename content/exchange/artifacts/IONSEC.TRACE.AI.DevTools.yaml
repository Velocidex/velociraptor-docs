      LET jupyter_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "jupyter_ai" AS Platform
          FROM glob(globs=[
              home + "/.jupyter/ai_chat/**",
