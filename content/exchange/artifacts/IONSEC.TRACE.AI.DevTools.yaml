              home + "/.claude/config.json",
              home + "/.claude/settings.json",
              home + "/.claude/credentials.json",
              home + "/.claude/projects/**",
              home + "\\.claude\\config.json",
              home + "\\.claude\\settings.json",
              home + "\\.claude\\credentials.json",
              home + "\\.claude\\projects\\**",
          ], accessor="file")

      LET claude_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "claude_code" AS Platform
          FROM glob(globs=[
              home + "/.claude/conversations/**",
              home + "/.claude/history/**",
              home + "\\.claude\\conversations\\**",
              home + "\\.claude\\history\\**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET claude_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "log" AS ArtifactType, "claude_code" AS Platform
          FROM glob(globs=[
              home + "/.claude/logs/**",
              home + "\\.claude\\logs\\**",
          ], accessor="file")
          WHERE CollectLogs

      LET claude_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
                 "claude_code" AS Platform
          FROM pslist() WHERE Name =~ "(?i)claude" OR CommandLine =~ "(?i)claode"

      SELECT * FROM chain(a=claude_config, b=claude_history, c=claude_logs, d=claude_proc)

  - name: CodexCLI_All
