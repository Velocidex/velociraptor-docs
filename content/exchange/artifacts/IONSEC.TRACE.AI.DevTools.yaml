  - name: GitHubCopilot_All
    query: |
      LET home = expand(path=HomeDir)

      LET copilot_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "github_copilot" AS Platform
          FROM glob(globs=[
              home + "/.config/github-copilot/config.json",
              home + "/.config/github-copilot/apps.json",
              home + "/.github-copilot/**",
              home + "\\.github-copilot\\**",
              home + "\\AppData\\Roaming\\GitHub Copilot\\**",
              home + "/Library/Application Support/GitHub Copilot/**",
          ], accessor="file")
          WHERE NOT IsDir OR FullPath =~ "config|settings|apps|token"

      LET copilot_vscode = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "extension_config" AS ArtifactType, "github_copilot" AS Platform
          FROM glob(globs=[
              home + "/.vscode/extensions/github.copilot*/**",
              home + "/.vscode/extensions/github.copilot-chat*/**",
              home + "\\.vscode\\extensions\\github.copilot*\\**",
              home + "\\AppData\\Roaming\\Code\\User\\globalStorage\\github.copilot*\\**",
              home + "/Library/Application Support/Code/User/globalStorage/github.copilot*/**",
          ], accessor="file")
          WHERE DeepCollection

      LET copilot_jetbrains = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "extension_config" AS ArtifactType, "github_copilot" AS Platform
          FROM glob(globs=[
              home + "/.config/JetBrains/*/plugins/github-copilot*/**",
              home + "\\.config\\JetBrains\\*\\plugins\\github-copilot*\\**",
              home + "/.local/share/JetBrains/Toolbox/apps/*/plugins/github-copilot*/**",
          ], accessor="file")
          WHERE DeepCollection

      LET copilot_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
