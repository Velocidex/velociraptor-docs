              home + "/.cline/conversations/**",
              home + "\\.cline\\tasks\\**",
              home + "\\.cline\\conversations\\**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET cline_vscode = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "extension_config" AS ArtifactType, "cline" AS Platform
          FROM glob(globs=[
              home + "/.vscode/extensions/saoudrizwan.claude-dev*/**",
              home + "/.vscode/extensions/saoudrizwan.claude-dev*",
              home + "\\.vscode\\extensions\\saoudrizwan.claude-dev*\\**",
              home + "\\AppData\\Roaming\\Code\\User\\globalStorage\\saoudrizwan.claude-dev*\\**",
              home + "/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev*/**",
          ], accessor="file")
