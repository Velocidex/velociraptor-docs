              home + "/.jupyter/jupyter_ai_config.json",
              home + "/.jupyter/jupyter_ai_config.yaml",
              home + "/.jupyter/jupyter_server_config.json",
              home + "/.jupyter/jupyter_server_config.py",
              home + "/.jupyter/jupyter_notebook_config.json",
              home + "\\.jupyter\\jupyter_ai_config.json",
              home + "\\.jupyter\\jupyter_ai_config.yaml",
              home + "\\.jupyter\\jupyter_server_config.json",
              home + "\\.jupyter\\jupyter_notebook_config.json",
              home + "/Library/Application Support/Jupyter/jupyter_ai_config.json",
