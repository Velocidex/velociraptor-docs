          FROM pslist() WHERE CommandLine =~ "(?i)jupyter.ai|jupyter-ai"

      SELECT * FROM chain(a=jupyter_config, b=jupyter_history, c=jupyter_logs, d=jupyter_proc)

column_types:
  - name: ArtifactType
    type: string
  - name: Platform
    type: string
  - name: FileHash
    type: string