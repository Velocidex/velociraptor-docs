      LET codex_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "codex_cli" AS Platform
          FROM glob(globs=[
              home + "/.codex/config.json",
              home + "/.codex/config.yaml",
              home + "/.codex/config.toml",
              home + "/.codex/.env",
              home + "\\.codex\\config.json",
              home + "\\.codex\\config.yaml",
              home + "\\.codex\\config.toml",
              home + "\\.codex\\.env",
          ], accessor="file")

      LET codex_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "codex_cli" AS Platform
          FROM glob(globs=[
              home + "/.codex/history/**",
              home + "/.codex/sessions/**",
              home + "\\.codex\\history\\**",
              home + "\\.codex\\sessions\\**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET codex_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
                 "codex_cli" AS Platform
          FROM pslist() WHERE Name =~ "(?i)codex" OR CommandLine =~ "(?i)codex"

      SELECT * FROM chain(a=codex_config, b=codex_history, c=codex_proc)

  - name: Continue_All
    query: |
      LET home = expand(path=HomeDir)

      LET continue_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "continue" AS Platform
          FROM glob(globs=[
              home + "/.continue/config.json",
              home + "/.continue/config.yaml",
              home + "/.continue/config.ts",
              home + "/.continue/config.js",
              home + "/.continue/continue.json",
              home + "\\.continue\\config.json",
              home + "\\.continue\\config.yaml",
              home + "\\.continue\\continue.json",
              home + "\\.continue\\config.ts",
          ], accessor="file")

      LET continue_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "continue" AS Platform
          FROM glob(globs=[
