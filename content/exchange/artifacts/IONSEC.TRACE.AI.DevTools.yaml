name: IONSEC.TRACE.AI.DevTools
description: |
  IONSEC TRACE — Collect forensic artifacts from AI developer tools
  (Cursor, Claude Code, Codex CLI, Continue, Cline, Warp, GitHub Copilot, Jupyter AI).

  Version: 0.1.0
  Author: IONSEC

  This artifact collects:
  - Configuration files and settings for AI dev tools
  - Conversation/chat history and session data
  - Extension/plugin configurations
  - Cache and log data
  - Process detection for running AI dev tool processes

type: CLIENT
parameters:
  - name: CollectChatHistory
    description: Collect conversation/chat history databases (may contain PII)
    type: bool
    default: true
  - name: CollectLogs
    description: Collect AI dev tool logs
    type: bool
    default: true
  - name: DeepCollection
    description: Include session-level and cache data (large, skip for quick triage)
    type: bool
    default: false

sources:
  - name: Cursor_Linux
    precondition: SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET home = expand(path=HomeDir)

      LET cursor_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/config.json",
              home + "/.cursor/settings.json",
              home + "/.cursor/mcp.json",
              home + "/.cursor/extensions/**",
          ], accessor="file")
          WHERE DeepCollection

      LET cursor_storage = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "storage" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/storage/**",
              home + "/.cursor/User/globalStorage/**",
              home + "/.cursor/User/workspaceStorage/**",
          ], accessor="file")
          WHERE DeepCollection

      LET cursor_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/User/globalStorage/cur****/cursorChat/**",
              home + "/.cursor/User/globalStorage/cur****/cursorComposer/**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET cursor_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "log" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/logs/**",
          ], accessor="file")
          WHERE CollectLogs

      LET cursor_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
                 "cursor" AS Platform
          FROM pslist() WHERE Name =~ "(?i)cursor"

      SELECT * FROM chain(a=cursor_config, b=cursor_storage, c=cursor_history, d=cursor_logs, e=cursor_proc)

  - name: Cursor_macOS
    precondition: SELECT OS FROM info() WHERE OS = 'darwin'
    query: |
      LET home = expand(path=HomeDir)

      LET cursor_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/config.json",
              home + "/.cursor/settings.json",
              home + "/.cursor/mcp.json",
              home + "/Library/Application Support/Cursor/**",
          ], accessor="file")
          WHERE DeepCollection

      LET cursor_storage = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "storage" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/User/globalStorage/**",
              home + "/.cursor/User/workspaceStorage/**",
              home + "/Library/Application Support/Cursor/User/globalStorage/**",
              home + "/Library/Application Support/Cursor/User/workspaceStorage/**",
          ], accessor="file")
          WHERE DeepCollection

      LET cursor_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/User/globalStorage/cur****/cursorChat/**",
              home + "/.cursor/User/globalStorage/cur****/cursorComposer/**",
              home + "/Library/Application Support/Cursor/User/globalStorage/cur****/cursorChat/**",
              home + "/Library/Application Support/Cursor/User/globalStorage/cur****/cursorComposer/**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET cursor_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "log" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "/.cursor/logs/**",
              home + "/Library/Logs/Cursor/**",
          ], accessor="file")
          WHERE CollectLogs

      LET cursor_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
                 "cursor" AS Platform
          FROM pslist() WHERE Name =~ "(?i)cursor"

      SELECT * FROM chain(a=cursor_config, b=cursor_storage, c=cursor_history, d=cursor_logs, e=cursor_proc)

  - name: Cursor_Windows
    precondition: SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      LET home = expand(path=HomeDir)
      LET appdata = expand(path=AppDataDir)

      LET cursor_config = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "config" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              home + "\\.cursor\\config.json",
              home + "\\.cursor\\settings.json",
              home + "\\.cursor\\mcp.json",
              appdata + "\\Cursor\\**",
          ], accessor="file")
          WHERE DeepCollection

      LET cursor_storage = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "storage" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              appdata + "\\Cursor\\User\\globalStorage\\**",
              appdata + "\\Cursor\\User\\workspaceStorage\\**",
          ], accessor="file")
          WHERE DeepCollection

      LET cursor_history = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "chat_history" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              appdata + "\\Cursor\\User\\globalStorage\\cur****\\cursorChat\\**",
              appdata + "\\Cursor\\User\\globalStorage\\cur****\\cursorComposer\\**",
          ], accessor="file")
          WHERE CollectChatHistory

      LET cursor_logs = SELECT FullPath, Mtime, Size, hash(path=FullPath) AS FileHash,
                 "log" AS ArtifactType, "cursor" AS Platform
          FROM glob(globs=[
              appdata + "\\Cursor\\logs\\**",
          ], accessor="file")
          WHERE CollectLogs

      LET cursor_proc = SELECT Name AS ProcessName, Pid, CommandLine, Exe,
                 create_time AS CreateTime, "process" AS ArtifactType,
                 "cursor" AS Platform
          FROM pslist() WHERE Name =~ "(?i)cursor"

      SELECT * FROM chain(a=cursor_config, b=cursor_storage, c=cursor_history, d=cursor_logs, e=cursor_proc)

  - name: ClaudeCode_All
