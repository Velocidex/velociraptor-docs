sources:
  - query: |
      LET KnownIDs <= SELECT lowcase(string=ID) AS ID, Name AS KnownName FROM KnownBadExtensions

      LET AllSitesRegex = '^(<all_urls>|\\*://\\*/\\*?|https?://\\*/\\*?)$'
      LET BroadUrlFilterRegex = '^[|*]*(https?:?/*)?[*]*$'
      LET BroadRegexFilterRegex = '^\\^?(https?\\??:?(\\\\?/){0,2}|\\(https\\?\\|wss\\?\\):(\\\\?/){0,2})?\\.[*+]\\$?$'

      LET BrowserOf(P) = if(condition=P =~ "(?i)edge", then="Edge",
         else=if(condition=P =~ "(?i)brave", then="Brave",
         else=if(condition=P =~ "(?i)vivaldi", then="Vivaldi",
         else=if(condition=P =~ "(?i)opera", then="Opera",
         else=if(condition=P =~ "(?i)firefox|mozilla", then="Firefox",
         else=if(condition=P =~ "(?i)chromium", then="Chromium",
         else="Chrome"))))))

      // Null-safe list concatenation (MV2 manifests have no host_permissions).
      LET AsList(X) = if(condition=X, then=X, else=array())

      // Many extension JSON files start with a UTF-8 byte order mark.
      LET ReadText(Accessor, Path) = regex_replace(re="^\\x{FEFF}", replace="",
         source=read_file(accessor=Accessor, filename=Path, length=20000000))
      LET ReadJson(Accessor, Path) = parse_json(data=ReadText(Accessor=Accessor, Path=Path))

      LET ChromiumExtensions = SELECT OSPath AS ManifestPath, "auto" AS Accessor,
             OSPath.String AS Location,
             OSPath.Components[-3] AS Identifier,
             OSPath.Components[-2] AS Version,
             ReadJson(Accessor="auto", Path=OSPath) AS Manifest
        FROM glob(globs=ChromiumManifestGlobs)

      LET FirefoxExtensions = SELECT * FROM foreach(row={
            SELECT OSPath AS XpiPath FROM glob(globs=FirefoxXpiGlobs)
          }, query={
            SELECT pathspec(DelegatePath=XpiPath, Path="manifest.json") AS ManifestPath,
                   "zip" AS Accessor,
                   XpiPath.String AS Location,
                   Manifest.browser_specific_settings.gecko.id ||
                     Manifest.applications.gecko.id ||
                     XpiPath.Basename AS Identifier,
                   Manifest.version AS Version,
                   Manifest
            FROM foreach(row={
              SELECT ReadJson(Accessor="zip",
                       Path=pathspec(DelegatePath=XpiPath, Path="manifest.json")) AS Manifest
              FROM scope()
            })
          })

      // Resolve __MSG_name__ strings from the default locale. Message
      // names are case-insensitive in Chrome, so keys are lowercased.
      LET LowerKeys(D) = to_dict(item={
         SELECT lowcase(string=_key) AS _key, _value FROM items(item=D) })
      LET Localized(Accessor, ManifestPath, Manifest, Value) = if(
         condition=format(format="%v", args=Value) =~ "^__MSG_.+__$" AND Manifest.default_locale,
         then=get(item=LowerKeys(D=ReadJson(Accessor=Accessor,
                    Path=ManifestPath.Dirname + "_locales" + Manifest.default_locale + "messages.json")),
                  member=lowcase(string=regex_replace(source=Value, re="^__MSG_(.+)__$", replace="$1"))).message || Value,
         else=Value)

      LET Extensions = SELECT *,
             Localized(Accessor=Accessor, ManifestPath=ManifestPath,
                       Manifest=Manifest, Value=Manifest.name) AS Name,
             BrowserOf(P=Location) AS Browser,
             filter(list=AsList(X=Manifest.host_permissions) + AsList(X=Manifest.permissions),
                    regex=AllSitesRegex) AS AllSitesGrants,
             lowcase(string=Identifier) IN KnownIDs.ID AS KnownBad
        FROM chain(a=ChromiumExtensions, b=FirefoxExtensions)
        WHERE Manifest

      // One row per ruleset file registered in the manifest.
      LET Rulesets = SELECT * FROM foreach(row=Extensions, query={
          SELECT Browser, Identifier, Version, Name, Location, Accessor,
                 ManifestPath, AllSitesGrants, KnownBad,
                 id AS RulesetId,
                 NOT enabled = FALSE AS RulesetEnabled,
                 ManifestPath.Dirname + split(string=path, sep="/") AS RulesetPath
          FROM foreach(row=Manifest.declarative_net_request.rule_resources)
          WHERE path
        })

      // Ad blockers ship hundreds of large rulesets, so only parse the
      // ones whose raw text mentions a header we care about.
      LET CandidateRulesets = SELECT *, ReadText(Accessor=Accessor, Path=RulesetPath) AS Text
        FROM Rulesets
        WHERE Text =~ RulesetPrefilterRegex

      LET Rules = SELECT * FROM foreach(row=CandidateRulesets, query={
          SELECT Browser, Identifier, Version, Name, Location, AllSitesGrants,
                 KnownBad, RulesetId, RulesetEnabled, RulesetPath,
                 id AS RuleId, action AS Action, condition AS Condition
          FROM foreach(row=parse_json_array(data=Text))
          WHERE Action.type = "modifyHeaders"
        })

      LET HeaderOps(Action) = SELECT lowcase(string=header) AS Header,
             operation AS Operation
        FROM foreach(row=Action.responseHeaders)
        WHERE Operation =~ "^(remove|set)$"

      LET Analysed = SELECT *,
             HeaderOps(Action=Action).Header AS ChangedHeaders,
             filter(list=HeaderOps(Action=Action).Header, regex=SecurityHeaderRegex) AS StrippedSecurityHeaders,
             filter(list=HeaderOps(Action=Action).Header, regex="^content-security-policy$") AS CSP,
             filter(list=HeaderOps(Action=Action).Header, regex="^x-frame-options$") AS XFO,
             (NOT Condition.requestDomains AND NOT Condition.initiatorDomains AND
              NOT Condition.domains AND
              (NOT Condition.urlFilter OR Condition.urlFilter =~ BroadUrlFilterRegex) AND
              (NOT Condition.regexFilter OR Condition.regexFilter =~ BroadRegexFilterRegex)) AS MatchesAllUrls
        FROM Rules

      LET DecoysOf(Headers) = SELECT _value AS H FROM foreach(row=Headers)
        WHERE NOT H =~ SecurityHeaderRegex AND NOT H =~ RealHeaderRegex

      LET Hits = SELECT *, DecoysOf(Headers=ChangedHeaders) AS DecoyRows
        FROM Analysed
        WHERE StrippedSecurityHeaders

      LET Graded = SELECT Browser, Identifier, Version, Name,
             if(condition=KnownBad, then="Confirmed",
               else=if(condition=CSP AND XFO AND MatchesAllUrls AND AllSitesGrants AND DecoyRows,
                 then="High",
               else=if(condition=MatchesAllUrls AND AllSitesGrants,
                 then="Medium", else="Low"))) AS Severity,
             StrippedSecurityHeaders, DecoyRows.H AS DecoyHeaders,
             MatchesAllUrls, AllSitesGrants, KnownBad AS OnCRXfiltrateList,
             RulesetId, RulesetEnabled, RuleId,
             Condition AS RuleCondition,
             RulesetPath.String AS RulesetPath, Location
        FROM Hits

      // Extensions on the published list that have no stripping rule in
      // their static rulesets are still reported.
      LET GradedRows <= SELECT * FROM Graded
      LET KnownWithoutRule = SELECT Browser, Identifier, Version, Name,
             "Confirmed" AS Severity, NULL AS StrippedSecurityHeaders,
             NULL AS DecoyHeaders, NULL AS MatchesAllUrls, AllSitesGrants,
             TRUE AS OnCRXfiltrateList, NULL AS RulesetId,
             NULL AS RulesetEnabled, NULL AS RuleId, NULL AS RuleCondition,
             NULL AS RulesetPath, Location
        FROM Extensions
        WHERE KnownBad AND NOT Identifier IN GradedRows.Identifier

      SELECT * FROM chain(a=GradedRows, b=KnownWithoutRule)
