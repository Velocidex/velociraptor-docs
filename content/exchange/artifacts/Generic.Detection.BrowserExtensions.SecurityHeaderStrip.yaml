name: Generic.Detection.BrowserExtensions.SecurityHeaderStrip
author: Mohith Gajjela - @Mohith26
description: |
  Finds browser extensions whose declarativeNetRequest (DNR) rules remove
  or overwrite the `Content-Security-Policy` or `X-Frame-Options` response
  headers on every site.

  Stripping these two headers is the gate of the CRXfiltrate (also known
  as Phoenix Invicta) extension family documented by 7AI Threat Research
  and Wladimir Palant: once CSP is gone, the extension's content script can
  inject server-chosen JavaScript into pages the user is signed in to.
  Extension IDs and domains in that family rotate quickly, but the header
  strip is in every build, so this artifact looks for the technique instead
  of relying only on an ID list. It never runs extension code: it only
  reads `manifest.json` and the static rule files the manifest registers.

  For each Chromium-based browser profile (Chrome, Edge, Brave, Vivaldi,
  Opera, Chromium) and each Firefox `.xpi`, the artifact reads the
  manifest, opens every ruleset listed under
  `declarative_net_request.rule_resources` (including rulesets that are
  disabled by default, since an extension can enable them at runtime), and
  reports each `modifyHeaders` rule that removes or sets a header matching
  `SecurityHeaderRegex`.

  Each hit is graded:

  - **Confirmed**: the extension ID is on the published CRXfiltrate list
    (`KnownBadExtensions`, from 7AI's September 2026 indicators). An
    installed ID is reported even if no stripping rule is found.
  - **High**: strips both CSP and X-Frame-Options, the rule matches every
    URL, the extension has access to all sites, and the same rule also
    removes header names that are not real HTTP headers (CRXfiltrate pads
    the two real headers with invented, theme-matching names such as
    `gamma-adjustment-service`).
  - **Medium**: strips CSP or X-Frame-Options on every URL with all-sites
    access, without decoy padding. Some ad blockers and developer tools do
    this legitimately, so review the extension's purpose.
  - **Low**: the strip is limited to specific domains, or the extension
    lacks host access to all sites.

  Limitations: dynamic and session rules added at runtime with
  `updateDynamicRules` / `updateSessionRules` are stored in the browser's
  LevelDB state and are not parsed here, and header changes made with the
  older `webRequest` API are not covered.

reference:
  - https://7ai.com/crxfiltrate
  - https://palant.info/2025/01/20/malicious-extensions-circumvent-googles-remote-code-ban/
  - https://developer.chrome.com/docs/extensions/reference/api/declarativeNetRequest

type: CLIENT

parameters:
  - name: ChromiumManifestGlobs
    description: Globs for Chromium-based extension manifests (Extensions/<id>/<version>/manifest.json).
    type: json_array
    default: |
      ["C:/Users/*/AppData/Local/{Google/Chrome,Google/Chrome Beta,Microsoft/Edge,BraveSoftware/Brave-Browser,Vivaldi,Chromium}/User Data/*/Extensions/*/*/manifest.json",
       "C:/Users/*/AppData/Roaming/Opera Software/Opera Stable/{,*/}Extensions/*/*/manifest.json",
       "/Users/*/Library/Application Support/{Google/Chrome,Google/Chrome Beta,Microsoft Edge,BraveSoftware/Brave-Browser,Vivaldi,Chromium,com.operasoftware.Opera}/{,*/}Extensions/*/*/manifest.json",
       "/{root,home/*}/.config/{google-chrome,google-chrome-beta,chromium,microsoft-edge,BraveSoftware/Brave-Browser,vivaldi,opera}/{,*/}Extensions/*/*/manifest.json",
       "/home/*/snap/chromium/common/chromium/*/Extensions/*/*/manifest.json"]
  - name: FirefoxXpiGlobs
    description: Globs for Firefox extension packages (.xpi files in each profile's extensions folder).
    type: json_array
    default: |
      ["C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/extensions/*.xpi",
       "/Users/*/Library/Application Support/Firefox/Profiles/*/extensions/*.xpi",
       "/{root,home/*}/.mozilla/firefox/*/extensions/*.xpi",
       "/home/*/snap/firefox/common/.mozilla/firefox/*/extensions/*.xpi"]
  - name: SecurityHeaderRegex
    description: Response headers whose removal or replacement is reported.
    type: regex
    default: ^(content-security-policy|x-frame-options)$
  - name: RulesetPrefilterRegex
    description: |
      Rule files are only parsed if their raw text matches this regex.
      Keep it in sync with SecurityHeaderRegex if you change that.
    type: regex
    default: (?i)(content-security-policy|x-frame-options)
  - name: RealHeaderRegex
    description: |
      Header names treated as real when counting decoy padding. Removed
      headers that match neither this nor SecurityHeaderRegex are reported
      as DecoyHeaders.
    type: regex
    default: ^(accept-.*|access-control-.*|age|alt-svc|cache-control|clear-site-data|connection|content-.*|cross-origin-.*|date|etag|expect-ct|expires|keep-alive|last-modified|link|location|nel|origin-agent-cluster|permissions-policy|pragma|referrer-policy|report-to|reporting-endpoints|retry-after|server|server-timing|set-cookie|strict-transport-security|timing-allow-origin|trailer|transfer-encoding|upgrade|vary|via|warning|www-authenticate|x-content-type-options|x-dns-prefetch-control|x-download-options|x-permitted-cross-domain-policies|x-powered-by|x-robots-tag|x-ua-compatible|x-xss-protection|document-policy|feature-policy|sec-.*|x-frame-options)$
