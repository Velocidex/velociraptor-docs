name: Windows.Detection.LocalAIAgents
author: Deniz Ciftci
reference:
  - https://learn.microsoft.com/en-us/defender-endpoint/discover-local-ai-agents

description: |
  This hunt inventories locally-installed AI agents on Windows endpoints:
  CLI coding agents, desktop apps, AI-powered IDEs, VS Code
  extensions, Claw-family agents, and local LLM runtimes that people install on
  their own without going through IT.

  The design keeps the detection logic simple and puts all the knowledge in
  editable lookup tables. Each agent is identified by the files it
  leaves on disk and the way its process looks at runtime.

  Four sources, each answering a different question:

    InstalledFootprint: Is the agent on disk? Globs a table of known install,
    config, and extension paths under each user profile. It only checks whether
    the path exists (path, mtime, size) and does not open any file.

    RunningAgents: Is it running now, and who is running it? Walks pslist() and
    matches process name, command line, and exe path against a signature table.
    It also reports the Authenticode signer of the exe so a spoofed binary
    stands out. The signer is reported, not used to filter, so baseline your
    fleet's normal signers first.

    MCPInventory: What can the agent reach? Not just whether it is installed,
    but which tools and endpoints it can talk to. It reads each agent's MCP
    config and extracts the defined servers (name, command, args, url). A single
    MCPConfigLookup table carries a Format column: JSON configs are parsed
    directly, while Codex (TOML) and Goose (YAML) are read with regex.

    UsageEvidence: When was it last used? Globs each agent's session and history
    files and reports mtime and size only.

  False positives: 'warp' collides with Cloudflare WARP, so it is excluded
  explicitly.

precondition: SELECT OS From info() where OS = 'windows'

parameters:
  - name: UsersGlob
    default: C:/Users/*
    description: Root path for user profiles. Profiles of logged-off users are included.

  - name: FootprintLookup
    description: "Filesystem traces: install, config, and extension paths per agent. Checks path existence only; files are not opened. Scope=home joins the path to each profile dir, Scope=abs is used as-is."
