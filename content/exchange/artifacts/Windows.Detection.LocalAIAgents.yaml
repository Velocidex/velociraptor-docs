  - name: ProcessLookup
    description: "Process signatures matched against a running process by name, command line, and exe path. A match requires NameRegex AND (CmdlineRegex OR PathRegex)."
    type: csv
    default: |
      Agent,NameRegex,CmdlineRegex,PathRegex,Ports
      Claude Code,(?i)^(node|claude)(\.exe)?$,@anthropic-ai[\\/]claude-code,[\\/]\.claude[\\/],
      Claude Desktop,(?i)^claude\.exe$,,AnthropicClaude,
      Codex CLI,(?i)^(node|codex)(\.exe)?$,@openai[\\/]codex|codex (exec|resume),[\\/]\.codex[\\/],
      Codex Desktop,(?i)^Codex\.exe$,,OpenAI\.Codex,
      ChatGPT Desktop,(?i)^ChatGPT\.exe$,,ChatGPT-Desktop,
      Gemini CLI,(?i)^(node|gemini)(\.exe)?$,@google[\\/]gemini-cli,@google[\\/]gemini-cli,
      GitHub Copilot CLI,(?i)^(node|copilot)(\.exe)?$,@github[\\/]copilot,@github[\\/]copilot,
      Junie CLI,(?i)^junie(\.exe)?$,junie,[\\/]\.junie[\\/],
      Kiro CLI,(?i)^(kiro-cli|q)(\.exe)?$,kiro-cli|amazonq,[\\/](kiro-cli|q)(\.exe)?$,
      Kiro IDE,(?i)^Kiro\.exe$,,Programs[\\/]Kiro,
      OpenCode,(?i)^opencode(\.exe)?$,opencode,opencode,
      Warp,(?i)^warp\.exe$,,AppData[\\/]Local[\\/][Ww]arp,
      Antigravity IDE,(?i)^Antigravity\.exe$,,Antigravity,
      Devin (ex-Windsurf),(?i)^(Devin|Windsurf)\.exe$,,(Devin|Windsurf),
      Cursor,(?i)^Cursor\.exe$,,Programs[\\/]cursor,
      Cursor CLI,(?i)^cursor-agent(\.exe)?$,cursor-agent,cursor-agent,
      Trae,(?i)^Trae(CN)?\.exe$,,Trae,
      Goose,(?i)^goose(\.exe)?$,goose (session|run|web),[Gg]oose,
      Hermes Agent,(?i)^(python[0-9.]*|hermes)(\.exe)?$,hermes (gateway|chat|setup)|hermes-agent,[\\/](\.hermes|hermes)[\\/],8642
      Ollama,(?i)^(ollama|ollama app)\.exe$,ollama (serve|run|pull),Ollama,11434
      LM Studio,(?i)^(LM Studio|lms)(\.exe)?$,lms (server|load),LM Studio|\.lmstudio,1234
      Jan,(?i)^Jan\.exe$,,[\\/]Jan[\\/],1337
      GPT4All,(?i)^(gpt4all|chat)\.exe$,gpt4all,GPT4All,
      Zed,(?i)^zed\.exe$,,Zed,
      Perplexity Desktop,(?i)^Perplexity\.exe$,,Perplexity,
      Poe Desktop,(?i)^Poe\.exe$,,Poe,
      OpenClaw,(?i)^node(\.exe)?$,openclaw,openclaw,18789
      QClaw,(?i)^(node|qclaw)(\.exe)?$,quantumclaw|qclaw,[Qq]Claw|quantumclaw,3000
      Nanobot,(?i)^nanobot(\.exe)?$,nanobot,nanobot,
      Aider,(?i)^(python[0-9.]*|aider)(\.exe)?$,aider,aider,
      OpenHands,(?i)^(python[0-9.]*|uvx?)(\.exe)?$,openhands,openhands,
      Amp,(?i)^(node|amp)(\.exe)?$,@sourcegraph[\\/]amp,@sourcegraph[\\/]amp,

  - name: MCPConfigLookup
    description: "MCP config files, used to extract the MCP servers each agent can reach. Format=json is parsed directly; toml (Codex) and yaml (Goose) are read with regex (VQL has no native TOML/YAML parser). The ExtractionMethod column shows which method was used."
    type: csv
    default: |
      Agent,Format,RelGlob
      Claude Desktop,json,AppData/Roaming/Claude/claude_desktop_config.json
      Claude Code,json,.claude.json
      Cursor,json,.cursor/mcp.json
      GitHub Copilot CLI,json,.copilot/mcp-config.json
      Kiro CLI,json,.kiro/settings/mcp.json
      Kiro CLI (legacy Q),json,.aws/amazonq/mcp.json
      Devin (ex-Windsurf),json,.codeium/windsurf/mcp_config.json
      Cline,json,AppData/Roaming/Code*/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json
      Roo Code,json,AppData/Roaming/Code*/User/globalStorage/rooveterinaryinc.roo-cline/settings/mcp_settings.json
      VSCode User,json,AppData/Roaming/Code*/User/mcp.json
      LM Studio,json,.lmstudio/mcp.json
      Trae,json,.trae/mcp.json
      Codex,toml,.codex/config.toml
      Goose,yaml,.config/goose/config.yaml

  - name: UsageLookup
    description: "Usage evidence: each agent's session/history files. The file mtime gives the last-used date; contents are not read."
    type: csv
    default: |
      Agent,RelGlob
      Claude Code,.claude/projects/*/*.jsonl
      Codex,.codex/sessions/**/*.jsonl
      Gemini CLI,.gemini/tmp/*/logs.json
      Cline,AppData/Roaming/Code*/User/globalStorage/saoudrizwan.claude-dev/tasks/*
      Roo Code,AppData/Roaming/Code*/User/globalStorage/rooveterinaryinc.roo-cline/tasks/*
      Ollama,.ollama/history
      OpenClaw,.openclaw/agents/**
      Continue,.continue/sessions/*
      Aider,.aider/**
      Hermes Agent,.hermes/logs/**

sources:
  - name: InstalledFootprint
    query: |
      LET Homes = SELECT OSPath AS HomeDir, OSPath.Basename AS Profile
        FROM glob(globs=UsersGlob)
        WHERE IsDir

      SELECT * FROM foreach(row=Homes, query={
        SELECT * FROM foreach(row=FootprintLookup, query={
          SELECT Agent, Category, Signal, Confidence, Profile,
                 OSPath AS Hit, Mtime, Size
          FROM glob(globs=if(condition=Scope = 'abs',
                             then=RelGlob,
                             else=HomeDir + '/' + RelGlob))
        })
      })

  - name: RunningAgents
    query: |
      LET procs = SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
        FROM pslist()
        WHERE NOT Exe =~ '(?i)cloudflare'

      SELECT * FROM foreach(row=procs, query={
        SELECT Agent, Ports, Pid, Ppid, Username, Name, Exe, CommandLine,
               CreateTime,
               authenticode(filename=Exe).Trusted AS SignerTrusted,
               authenticode(filename=Exe).SubjectName AS SignerSubject
        FROM ProcessLookup
        WHERE Name =~ NameRegex
          AND ( (CmdlineRegex AND CommandLine =~ CmdlineRegex)
             OR (PathRegex AND Exe =~ PathRegex)
             OR (PathRegex AND CommandLine =~ PathRegex) )
      })

  - name: MCPInventory
    query: |
      LET Homes = SELECT OSPath AS HomeDir, OSPath.Basename AS Profile
        FROM glob(globs=UsersGlob) WHERE IsDir

      LET Hits = SELECT * FROM foreach(row=Homes, query={
        SELECT * FROM foreach(row=MCPConfigLookup, query={
          SELECT Agent, Format, Profile, OSPath AS ConfigPath, Mtime
          FROM glob(globs=HomeDir + '/' + RelGlob)
        })
      })

      LET JsonServers = SELECT * FROM foreach(
        row={ SELECT * FROM Hits WHERE Format = 'json' },
        query={
          SELECT * FROM foreach(
            row={
              SELECT parse_json(data=read_file(filename=ConfigPath,
                                               length=1000000)) AS Doc
              FROM scope()
            },
            query={
              SELECT Agent, Profile, ConfigPath, Mtime,
                     _key AS ServerName,
                     _value.command AS Command,
                     _value.args AS Args,
                     _value.url AS Url,
                     'json' AS ExtractionMethod
              FROM items(item=Doc.mcpServers || Doc.servers)
            })
        })

      LET TomlServers = SELECT * FROM foreach(
        row={ SELECT * FROM Hits WHERE Format = 'toml' },
        query={
          SELECT Agent, Profile, ConfigPath, Mtime,
                 ServerName, '' AS Command, '' AS Args, '' AS Url,
                 'toml-regex' AS ExtractionMethod
          FROM parse_records_with_regex(file=ConfigPath,
                 regex='\\[mcp_servers\\.(?P<ServerName>[^\\]]+)\\]')
        })

      LET YamlServers = SELECT * FROM foreach(
        row={ SELECT * FROM Hits WHERE Format = 'yaml' },
        query={
          SELECT Agent, Profile, ConfigPath, Mtime,
                 '' AS ServerName, Line AS Command, '' AS Args, '' AS Url,
                 'yaml-regex' AS ExtractionMethod
          FROM parse_records_with_regex(file=ConfigPath,
                 regex='(?m)^(?P<Line>\\s+(cmd|command|uri|url):\\s*.+)$')
        })

      SELECT * FROM chain(a=JsonServers, b=TomlServers, c=YamlServers)

  - name: UsageEvidence
    query: |
      LET Homes = SELECT OSPath AS HomeDir, OSPath.Basename AS Profile
        FROM glob(globs=UsersGlob) WHERE IsDir

      SELECT * FROM foreach(row=Homes, query={
        SELECT * FROM foreach(row=UsageLookup, query={
          SELECT Agent, Profile,
                 OSPath AS SessionFile,
                 Mtime AS LastUsed, Size
          FROM glob(globs=HomeDir + '/' + RelGlob)
          WHERE NOT IsDir
        })
      })
      ORDER BY LastUsed DESC

column_types:
  - name: Mtime
    type: timestamp
  - name: CreateTime
    type: timestamp
  - name: LastUsed
    type: timestamp
