# -- Theme Options (Blowfish v3) --

colorScheme = "blowfish"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableA11y = false
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = false

# avoid per-request image resizing on the deploy pipeline
disableImageOptimization = false

[header]
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # Tile-based landing page: Blowfish's "landing" layout renders a hero
  # plus the feature-grid in content/_index.md.
  layout = "landing"
  showRecent = false
  showRecentItems = 5
  showMoreLink = false

[article]
  showDate = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showViews = false
  showAuthor = false
  showHero = false
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = true
  editURL = "https://github.com/Velocidex/velociraptor-docs/edit/master/content/"
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  invertPagination = true
  showReadingTime = false
  showReadingProgress = false
  showTableOfContents = true
  showTaxonomies = false
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true
  showViews = false
  showTableOfContents = false
  showCards = true
  orderByWeight = true
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showTableOfContents = true
  groupByYear = false
  cardView = false

# Google site verification (previously a hard-coded meta tag in the old
# custom header partial).
[verification]
  google = "TWf2C5KkKfaG0pltB0jltq3yWk7WhtFKmlpUQu7ukRQ"