# -- Markup --
# The Blowfish theme requires the parser attributes and passthrough
# extensions. Highlighting is entirely Chroma: vql/VQL code fences are
# aliased to Chroma's SQL lexer by layouts/_default/_markup/render-codeblock.html
# (VQL is SQL-derived); token colors come from Blowfish's bundled
# github-style chroma.css.

[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false
  # Chroma handles all code fences; the VQL grammar is added via
  # render-codeblock.html in a later phase.
  codeFences = true

[tableOfContents]
  startLevel = 2
  endLevel = 4