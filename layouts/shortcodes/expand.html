{{- /* Port of the learn-theme expand shortcode with Hextra styling. */ -}}

<details class="hx:group hx:mt-6 hx:rounded-lg hx:border hx:border-gray-200 hx:bg-gray-50 hx:dark:border-neutral-800 hx:dark:bg-neutral-900 hx:px-4 hx:py-3 not-prose">
