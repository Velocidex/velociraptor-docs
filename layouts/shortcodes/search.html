{{/* Site-wide search page backed by Pagefind (built by `pagefind --site public`). */}}
<div class="search-box" data-site-search>
  <div id="pagefind-site-search"></div>
</div>
<script>
  (function () {
    var el = document.getElementById("pagefind-site-search");
    if (!el) {
      return;
    }
    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "/pagefind/pagefind-ui.css";
    document.head.appendChild(css);

    var script = document.createElement("script");
    script.src = "/pagefind/pagefind-ui.js";
    script.onload = function () {
      new PagefindUI({
        element: "#pagefind-site-search",
        showSubResults: true,
        showImages: false,
        highlightParam: "q"
      });
    };
    document.head.appendChild(script);
  })();
</script>
